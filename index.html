<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرتّب المستمسكات للطباعة</title>
<style>
:root{--bg:#eef1f0;--card:#fff;--tx:#14231e;--mu:#5d6d67;--ac:#0e6b4d;--acx:#fff;--bd:#cfd9d5;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101614;--card:#18211e;--tx:#e8f0ed;--mu:#93a39d;--ac:#3fc796;--acx:#06251a;--bd:#2b3833;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Tahoma,"Segoe UI",system-ui,sans-serif}
header{padding:22px 16px 6px;max-width:1100px;margin:auto}
h1{margin:0;font-size:24px}
header p{margin:4px 0 0;color:var(--mu)}
main{max-width:1100px;margin:auto;padding:12px 16px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
section h2{margin:0 0 10px;font-size:16px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
select,input[type=number]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin-bottom:6px}
.slot{border:2px dashed var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.slot span{font-weight:700}
.slot.ok{border-style:solid;border-color:var(--ac)}
button,.btn{background:var(--ac);color:var(--acx);border:0;border-radius:7px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;display:inline-block}
button.sec,.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:7px 10px;font-weight:400}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#pages{display:flex;flex-wrap:wrap;gap:14px}
#pages figure{margin:0;flex:1 1 280px;max-width:460px}
#pages canvas{width:100%;height:auto;background:#fff;border:1px solid var(--bd);box-shadow:0 1px 6px rgba(0,0,0,.18)}
#pages figcaption{font-size:12px;color:var(--mu);text-align:center;margin-top:4px}
.item{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--bg)}.ih{display:flex;gap:8px;margin-bottom:8px}.ih select{flex:1}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#note{color:var(--mu);font-size:13px}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block}#pa img{display:block;width:100%;page-break-after:always;break-after:page}}
</style>
<style id="pg"></style>
</head>
<body>
<header><h1>مرتّب المستمسكات للطباعة</h1><p>ارفع صورة الوجه والظهر، والأداة تقصّ وتعدّل الإضاءة وترتّبها على الورقة. كل شيء يتم داخل جهازك ولا يُرفع أي شيء للإنترنت.</p></header>
<main>
<div>
<section><h2>١. المستمسكات على الورقة</h2>
<div id="items"></div>
<button id="add" type="button">+ إضافة مستمسك</button>
</section>
<section><h2>٢. التحسين التلقائي</h2>
<div class="ck"><input type="checkbox" id="crop" checked><label for="crop" style="margin:0;color:inherit">قص تلقائي للحواف</label></div>
<div class="ck"><input type="checkbox" id="enh" checked><label for="enh" style="margin:0;color:inherit">ضبط الإضاءة والألوان تلقائياً</label></div>
<div class="ck"><input type="checkbox" id="shp" checked><label for="shp" style="margin:0;color:inherit">زيادة وضوح الكتابة</label></div>
<label>السطوع<input type="range" id="br" min="-50" max="50" value="0"></label>
<label>التباين<input type="range" id="ct" min="-50" max="50" value="0"></label>
</section>
<section><h2>٣. الورقة والترتيب</h2>
<label>حجم الورقة<select id="paper"></select></label>
<div class="r" id="pc" hidden><label>العرض ملم<input type="number" id="pw" value="210"></label><label>الارتفاع ملم<input type="number" id="ph" value="297"></label></div>
<div class="r"><label>الاتجاه<select id="ori"><option value="p">عمودي</option><option value="l">أفقي</option></select></label>
</div>
<label>ترتيب الوجه والظهر<select id="lay"><option value="side">بجنب بعض</option><option value="stack">فوق بعض</option></select></label>
<div class="r"><label>المسافة بينها ملم<input type="number" id="gap" value="4" min="0"></label><label>هامش الورقة ملم<input type="number" id="mar" value="8" min="0"></label></div>
<div class="ck"><input type="checkbox" id="mk" checked><label for="mk" style="margin:0;color:inherit">إطار رفيع للقص</label></div>
</section>
</div>
<div>
<div class="acts"><button id="pdf">تنزيل PDF</button><button class="sec" id="png">تنزيل صور PNG</button><button class="sec" id="prt">طباعة</button></div>
<p id="note"></p>
<div id="pages"></div>
</div>
</main>
<div id="pa"></div>
<script>
const $=id=>document.getElementById(id),DPI=300,mm=v=>Math.round(v*DPI/25.4);
const DOCS={natl:['بطاقة وطنية',85.6,54,2],sn:['سنوية السيارة',85.6,54,2],lic:['إجازة سوق',85.6,54,2],card:['بطاقة ماستر / فيزا',85.6,54,2],res:['بطاقة سكن',100,70,2],pass:['جواز سفر (صفحة)',125,88,1],ph35:['صورة جواز 3.5×4.5 سم',35,45,1],ph34:['صورة معاملة 3×4 سم',30,40,1],ph46:['صورة طالب / وزاري 4×6 سم',40,60,1],ph25:['صورة صغيرة 2.5×3.5 سم',25,35,1],a4:['صفحة كاملة A4',200,287,1],cus:['مخصص (أي مستمسك)',85.6,54,2]};
const PAP={a4:['A4',210,297],a5:['A5',148,210],p46:['4×6 إنش',101.6,152.4],p57:['5×7 إنش',127,177.8],let:['Letter',215.9,279.4],cus:['حجم مخصص',210,297]};
const items=[];let pages=[],tm;
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
for(const k in PAP)$('paper').add(new Option(PAP[k][0],k));
function addItem(){items.push({type:'natl',w:85.6,h:54,n:2,copies:1,imgs:[null,null],rot:[0,0]});renderItems();refresh()}
function renderItems(){const IT=$('items');IT.innerHTML='';
 items.forEach((it,k)=>{const d=document.createElement('div');d.className='item';d.dataset.k=k;
  const opts=Object.keys(DOCS).map(t=>`<option value="${t}"${t==it.type?' selected':''}>${DOCS[t][0]}</option>`).join('');
  let sl='';for(let s=0;s<it.n;s++){const lb=it.n==1?'الصورة':s?'الظهر':'الوجه';
   sl+=`<div class="slot${it.imgs[s]?' ok':''}"><span>${lb}${it.imgs[s]?' ✓':''}</span><div><label class="btn sec" style="margin:0">اختيار<input type="file" accept="image/*" hidden data-f="file" data-s="${s}"></label> <button type="button" class="sec" data-f="rot" data-s="${s}" title="تدوير">⟳</button></div></div>`}
  d.innerHTML=`<div class="ih"><select data-f="type">${opts}</select><button type="button" class="sec" data-f="del">حذف</button></div>
<div class="r3"><label>العرض ملم<input type="number" data-f="w" step="0.1" min="10" value="${it.w}"></label><label>الارتفاع ملم<input type="number" data-f="h" step="0.1" min="10" value="${it.h}"></label><label>النسخ<input type="number" data-f="copies" min="1" max="60" value="${it.copies}"></label></div>
<label>الأوجه<select data-f="n"><option value="2"${it.n==2?' selected':''}>وجه وظهر</option><option value="1"${it.n==1?' selected':''}>وجه واحد</option></select></label>${sl}`;
  IT.append(d)})}
function paperDims(){let [,w,h]=PAP[$('paper').value];if($('paper').value=='cus'){w=+$('pw').value||210;h=+$('ph').value||297}
 const o=$('ori').value;return o=='l'?[Math.max(w,h),Math.min(w,h)]:[Math.min(w,h),Math.max(w,h)]}
function detect(c){const s=Math.min(1,300/Math.max(c.width,c.height)),w=c.width*s|0,h=c.height*s|0,t=cv(w,h),x=t.getContext('2d');
 x.drawImage(c,0,0,w,h);const p=x.getImageData(0,0,w,h).data;let r=0,g=0,b=0,n=0;
 const add=(X,Y)=>{const i=(Y*w+X)*4;r+=p[i];g+=p[i+1];b+=p[i+2];n++};
 for(let X=0;X<w;X++){add(X,0);add(X,h-1)}for(let Y=0;Y<h;Y++){add(0,Y);add(w-1,Y)}
 r/=n;g/=n;b/=n;const rows=new Uint16Array(h),cols=new Uint16Array(w);
 for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++){const i=(Y*w+X)*4;if(Math.abs(p[i]-r)+Math.abs(p[i+1]-g)+Math.abs(p[i+2]-b)>90){rows[Y]++;cols[X]++}}
 const f=(a,len)=>{let s=0,e=a.length-1;const th=len*.12;while(s<e&&a[s]<th)s++;while(e>s&&a[e]>=0&&a[e]<th)e--;return[s,e+1]};
 let [y0,y1]=f(rows,w),[x0,x1]=f(cols,h);
 if((x1-x0)*(y1-y0)<w*h*.25)return[0,0,c.width,c.height];
 x0=Math.max(0,x0-1);y0=Math.max(0,y0-1);x1=Math.min(w,x1+1);y1=Math.min(h,y1+1);
 return[x0/s,y0/s,(x1-x0)/s,(y1-y0)/s]}
function enhance(c){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data,n=p.length/4;
 let lo=0,hi=255,g=1;
 if($('enh').checked){const h=new Uint32Array(256);let sum=0;
  for(let i=0;i<p.length;i+=4){const l=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;h[l]++;sum+=l}
  let s=0;while(lo<254&&(s+=h[lo])<n*.01)lo++;s=0;while(hi>1&&(s+=h[hi])<n*.01)hi--;
  if(hi-lo<100){const m=(hi+lo)/2;lo=m-50;hi=m+50}
  const mn=Math.min(.9,Math.max(.1,(sum/n-lo)/(hi-lo)));g=Math.min(1.4,Math.max(.75,Math.log(.5)/Math.log(mn)))}
 const ct=1+$('ct').value/100,br=$('br').value/200,L=new Uint8ClampedArray(256);
 for(let v=0;v<256;v++){let t=Math.min(1,Math.max(0,(v-lo)/(hi-lo)));t=Math.pow(t,g);t=(t-.5)*ct+.5+br;L[v]=t*255}
 for(let i=0;i<p.length;i+=4){p[i]=L[p[i]];p[i+1]=L[p[i+1]];p[i+2]=L[p[i+2]]}
 if($('shp').checked){const w=c.width,h=c.height,o=new Uint8ClampedArray(p),a=.6;
  for(let y=1;y<h-1;y++)for(let X=1;X<w-1;X++){const i=(y*w+X)*4;for(let k=0;k<3;k++){const j=i+k,v=o[j]*(1+4*a)-a*(o[j-4]+o[j+4]+o[j-w*4]+o[j+w*4]);p[j]=v}}}
 x.putImageData(d,0,0)}
function proc(it,i){const b=it.imgs[i];if(!b)return null;const W=mm(it.w),H=mm(it.h),r=it.rot[i]%360,odd=r%180;
 const sw=odd?b.height:b.width,sh=odd?b.width:b.height,k=Math.min(1,2400/Math.max(sw,sh));
 const c0=cv(sw*k,sh*k),x=c0.getContext('2d');x.translate(c0.width/2,c0.height/2);x.rotate(r*Math.PI/180);x.drawImage(b,-b.width*k/2,-b.height*k/2,b.width*k,b.height*k);
 let [bx,by,bw,bh]=$('crop').checked?detect(c0):[0,0,c0.width,c0.height];
 const c=cv(W,H),y=c.getContext('2d');y.imageSmoothingQuality='high';
 if((bw>bh)!=(W>H)){y.translate(W/2,H/2);y.rotate(Math.PI/2);y.drawImage(c0,bx,by,bw,bh,-H/2,-W/2,H,W)}else y.drawImage(c0,bx,by,bw,bh,0,0,W,H);
 enhance(c);return c}
function render(){const G=mm($('gap').value||0),M=mm($('mar').value||0),[pw,ph]=paperDims(),PW=mm(pw),PH=mm(ph),st=$('lay').value=='stack',units=[];
 items.forEach(it=>{const W=mm(it.w),H=mm(it.h),n=it.n,outs=[proc(it,0),n>1?proc(it,1):null],uw=n==1||st?W:2*W+G,uh=n==1?H:st?2*H+G:H;
  for(let c=0;c<Math.max(1,it.copies|0);c++)units.push({W,H,n,outs,uw,uh})});
 const rowsH=a=>a.reduce((t,r)=>t+r.h,0)+G*Math.max(0,a.length-1),AW=PW-2*M,AH=PH-2*M,pgs=[{rows:[]}];let big=false;
 for(const u of units){let cur=pgs[pgs.length-1],r=cur.rows[cur.rows.length-1];if(u.uw>AW||u.uh>AH)big=true;
  if(r&&r.w+G+u.uw<=AW&&rowsH([...cur.rows.slice(0,-1),{h:Math.max(r.h,u.uh)}])<=AH){r.us.push(u);r.w+=G+u.uw;r.h=Math.max(r.h,u.uh);continue}
  if(cur.rows.length&&rowsH([...cur.rows,{h:u.uh}])>AH){cur={rows:[]};pgs.push(cur)}
  cur.rows.push({us:[u],w:u.uw,h:u.uh})}
 $('note').textContent=!units.length?'أضف مستمسكاً وارفع صورته.':big?'تنبيه: أحد المستمسكات أكبر من الورقة، اختر ورقة أكبر.':`${pgs.length} ورقة، ${units.length} مستمسك. الطباعة بدقة 300 DPI وبحجم حقيقي (اختر "100%" أو "الحجم الفعلي" عند الطباعة).`;
 pages=pgs.map(pg=>{const c=cv(PW,PH),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);let y=M;
  for(const r of pg.rows){let X=Math.max(0,(PW-r.w)/2);
   for(const u of r.us){for(let s=0;s<u.n;s++){const sx=s&&!st?X+u.W+G:X,sy=s&&st?y+u.H+G:y;
     if(u.outs[s])x.drawImage(u.outs[s],sx,sy);else{x.fillStyle='#f3f3f3';x.fillRect(sx,sy,u.W,u.H);x.fillStyle='#999';x.font='36px sans-serif';x.textAlign='center';x.fillText(u.n==1?'الصورة':s?'الظهر':'الوجه',sx+u.W/2,sy+u.H/2)}
     if($('mk').checked){x.strokeStyle='#999';x.lineWidth=2;x.strokeRect(sx,sy,u.W,u.H)}}
    X+=u.uw+G}
   y+=r.h+G}
  return c});
 const box=$('pages');box.innerHTML='';pages.forEach((c,i)=>{const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent='ورقة '+(i+1)+' — '+pw+'×'+ph+' ملم';f.append(c,cap);box.append(f)})}
function refresh(){clearTimeout(tm);tm=setTimeout(()=>{$('pc').hidden=$('paper').value!='cus';render()},120)}
const IT=$('items'),idx=e=>+e.target.closest('.item').dataset.k;
IT.addEventListener('input',e=>{const f=e.target.dataset.f;if(['w','h','copies'].includes(f)){items[idx(e)][f]=+e.target.value;refresh()}});
IT.addEventListener('change',async e=>{const f=e.target.dataset.f;if(!f)return;const it=items[idx(e)];
 if(f=='type'){const d=DOCS[e.target.value];Object.assign(it,{type:e.target.value,w:d[1],h:d[2],n:d[3]});renderItems();refresh()}
 else if(f=='n'){it.n=+e.target.value;renderItems();refresh()}
 else if(f=='file'){const fl=e.target.files[0];if(!fl)return;const s=+e.target.dataset.s;
  try{it.imgs[s]=await createImageBitmap(fl);it.rot[s]=0;renderItems();refresh()}catch(_){$('note').textContent='تعذّر فتح الصورة، جرّب صيغة JPG أو PNG.'}}});
IT.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=idx(e),it=items[k];
 if(b.dataset.f=='del'){items.splice(k,1);renderItems();refresh()}else if(b.dataset.f=='rot'){const s=+b.dataset.s;it.rot[s]=(it.rot[s]+90)%360;refresh()}});
$('add').onclick=addItem;
['paper','pw','ph','ori','lay','gap','mar','mk','crop','enh','shp','br','ct'].forEach(id=>$(id).addEventListener('input',refresh));
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const jpg=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.95));
$('png').onclick=()=>pages.forEach((c,i)=>setTimeout(()=>c.toBlob(b=>save(b,`mustamsakat-${i+1}.png`)),i*400));
$('pdf').onclick=async()=>{const [pw,ph]=paperDims(),W=pw*72/25.4,H=ph*72/25.4,ch=[],offs=[];let len=0;
 const push=d=>{const b=typeof d=='string'?new TextEncoder().encode(d):d;ch.push(b);len+=b.length},n=pages.length;
 push('%PDF-1.4\n');offs[1]=len;push('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
 offs[2]=len;push(`2 0 obj<</Type/Pages/Count ${n}/Kids[${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}]>>endobj\n`);
 for(let i=0;i<n;i++){const c=pages[i],j=new Uint8Array(await(await jpg(c)).arrayBuffer()),p=3+3*i,cs=`q ${W} 0 0 ${H} 0 0 cm /I Do Q`;
  offs[p]=len;push(`${p} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Contents ${p+1} 0 R/Resources<</XObject<</I ${p+2} 0 R>>>>>>endobj\n`);
  offs[p+1]=len;push(`${p+1} 0 obj<</Length ${cs.length}>>stream\n${cs}\nendstream endobj\n`);
  offs[p+2]=len;push(`${p+2} 0 obj<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.length}>>stream\n`);push(j);push('\nendstream endobj\n')}
 const tot=3*n+3,xr=len;let x=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let k=1;k<tot;k++)x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
 push(x+`trailer<</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);save(new Blob(ch,{type:'application/pdf'}),'mustamsakat.pdf')};
$('prt').onclick=()=>{const [pw,ph]=paperDims();$('pg').textContent=`@page{size:${pw}mm ${ph}mm;margin:0}`;
 $('pa').innerHTML='';pages.forEach(c=>{const im=new Image();im.src=c.toDataURL('image/jpeg',.95);$('pa').append(im)});
 setTimeout(()=>window.print(),300)};
addItem();
</script>
</body>
</html>
